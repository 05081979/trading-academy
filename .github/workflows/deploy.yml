name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache version
        run: |
          VER=$(date +%Y%m%d%H%M%S)
          echo "Using cache version: $VER"
          echo "$VER" > version.txt
          # Bump ?v=... sur les CSS/JS locaux dans tous les HTML
          find . -name "*.html" -not -path "./.github/*" -print0 | \
            xargs -0 sed -i -E "s/(\.(css|js))\?v=[^\"' ]+/\1?v=$VER/g"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
